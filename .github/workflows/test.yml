name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        hugo: ["0.158.0", "latest"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: hugo-structured-data

      - name: Install Hugo ${{ matrix.hugo }}
        env:
          GH_TOKEN: ${{ github.token }}
          HUGO: ${{ matrix.hugo }}
        run: |
          v="$HUGO"
          if [ "$v" = latest ]; then
            v=$(gh api repos/gohugoio/hugo/releases/latest --jq .tag_name | tr -d v)
          fi
          curl -sfL -o hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${v}/hugo_${v}_linux-amd64.tar.gz"
          mkdir -p "$HOME/.local/hugo" && tar -C "$HOME/.local/hugo" -xf hugo.tar.gz hugo
          echo "$HOME/.local/hugo" >> "$GITHUB_PATH"

      - name: Build the example site
        working-directory: hugo-structured-data/exampleSite
        run: |
          hugo version
          hugo build --logLevel warn --panicOnWarning

      - name: Check the output
        working-directory: hugo-structured-data/exampleSite
        run: |
          set -e
          python3 - <<'EOF'
          import json, re, pathlib
          def graph(rel):
              html = pathlib.Path("public", rel).read_text(encoding="utf-8")
              blocks = re.findall(r'<script type="?application/ld\+json"?>(.*?)</script>', html, re.S)
              return [n["@type"] for b in blocks for n in json.loads(b)["@graph"]]
          assert graph("index.html") == ["Organization", "WebSite", "CollectionPage"], graph("index.html")
          assert "BlogPosting" in graph("blog/first-post/index.html")
          types = graph("products/tester/index.html")
          assert "Product" in types and "FAQPage" in types and "BreadcrumbList" in types, types
          assert graph("legal/index.html") == []
          print("structured data OK")
          EOF
